<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Au Dedans — Dashboard Admin</title>

  <!-- Tailwind CDN with brand color extensions -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold:  '#D4AF37',
            navy:  '#3D4A5C',
            deep:  '#111820',
          }
        }
      }
    }
  </script>

  <style>
    /* Sidebar active state */
    .nav-item.active { background: rgba(212,175,55,0.15); border-left: 3px solid #D4AF37; color: #D4AF37; }
    .nav-item        { border-left: 3px solid transparent; }

    /* Table row hover */
    .item-row:hover  { background-color: #f9fafb; }

    /* Smooth modal backdrop */
    .modal-backdrop  { backdrop-filter: blur(4px); }

    /* Loading skeleton pulse */
    .skeleton        { animation: pulse 1.5s ease-in-out infinite; background: #e5e7eb; border-radius: 4px; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    /* Toast slide-in */
    @keyframes slideIn { from { transform:translateX(110%) } to { transform:translateX(0) } }
    .toast { animation: slideIn 0.3s ease; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex">

<!-- ══════════════════════════════════════════
  TOAST NOTIFICATIONS (fixed top-right)
══════════════════════════════════════════ -->
<div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>


<!-- ══════════════════════════════════════════
  LAYOUT: SIDEBAR + MAIN
══════════════════════════════════════════ -->

<!-- ── SIDEBAR ───────────────────────────── -->
<aside class="w-64 min-h-screen bg-deep text-white flex flex-col shrink-0">

  <!-- Brand header -->
  <div class="px-6 py-6 border-b border-white/10">
    <p class="text-xs tracking-widest uppercase text-white/40 mb-1 font-medium" style="font-family:Montserrat,sans-serif">Restaurant</p>
    <p class="text-base font-bold tracking-wider uppercase text-white" style="font-family:Montserrat,sans-serif">L'Au Dedans</p>
    <p class="text-xs text-gold/70 mt-1" style="font-family:Montserrat,sans-serif">Admin Dashboard</p>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 flex flex-col gap-1">

    <!-- ─ Active module ─ -->
    <p class="text-xs text-white/30 uppercase tracking-widest px-3 pt-2 pb-1 font-semibold" style="font-family:Montserrat,sans-serif">Gestion</p>

    <button onclick="setSection('menu')"
      class="nav-item active w-full text-left px-3 py-2.5 rounded-r text-sm font-medium flex items-center gap-3 transition-colors"
      id="nav-menu" style="font-family:Montserrat,sans-serif">
      <span>🍽️</span> Menu
    </button>

    <!-- ─ Coming soon ─ -->
    <p class="text-xs text-white/30 uppercase tracking-widest px-3 pt-4 pb-1 font-semibold" style="font-family:Montserrat,sans-serif">Bientôt</p>

    <button disabled
      class="nav-item w-full text-left px-3 py-2.5 rounded-r text-sm flex items-center gap-3 text-white/25 cursor-not-allowed"
      style="font-family:Montserrat,sans-serif">
      <span>📅</span> Réservations
      <span class="ml-auto text-[10px] bg-white/10 px-1.5 py-0.5 rounded">soon</span>
    </button>

    <button disabled
      class="nav-item w-full text-left px-3 py-2.5 rounded-r text-sm flex items-center gap-3 text-white/25 cursor-not-allowed"
      style="font-family:Montserrat,sans-serif">
      <span>📢</span> Actualités
      <span class="ml-auto text-[10px] bg-white/10 px-1.5 py-0.5 rounded">soon</span>
    </button>

    <button disabled
      class="nav-item w-full text-left px-3 py-2.5 rounded-r text-sm flex items-center gap-3 text-white/25 cursor-not-allowed"
      style="font-family:Montserrat,sans-serif">
      <span>❓</span> FAQ
      <span class="ml-auto text-[10px] bg-white/10 px-1.5 py-0.5 rounded">soon</span>
    </button>
  </nav>

  <!-- Footer: view site + auth placeholder -->
  <div class="px-4 py-4 border-t border-white/10 flex flex-col gap-2">
    <a href="../index.html" target="_blank"
      class="text-xs text-white/40 hover:text-gold flex items-center gap-2 transition-colors px-2 py-1"
      style="font-family:Montserrat,sans-serif">
      ↗ Voir le site
    </a>
    <!--
      AUTH HOOK — future integration:
      Replace this with a real logout button once Supabase Auth is set up.
      supabase.auth.signOut() → redirect to /admin/login.html
    -->
    <button id="logoutBtn"
      class="text-xs text-white/20 hover:text-white/50 flex items-center gap-2 transition-colors px-2 py-1 text-left"
      style="font-family:Montserrat,sans-serif">
      ⚙ Déconnexion (auth à venir)

  </div>
</aside>


<!-- ── MAIN CONTENT ──────────────────────── -->
<main class="flex-1 flex flex-col min-h-screen overflow-auto">

  <!-- Top bar -->
  <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
    <div>
      <h1 class="text-xl font-bold text-gray-800" style="font-family:Montserrat,sans-serif" id="pageTitle">
        Menu Items
      </h1>
      <p class="text-xs text-gray-400 mt-0.5" id="pageSubtitle">Gérez les plats et vins affichés sur le site</p>
    </div>
    <button id="addBtn"
      class="bg-gold hover:bg-yellow-500 text-deep font-bold text-xs tracking-widest uppercase px-5 py-2.5 transition-colors flex items-center gap-2"
      style="font-family:Montserrat,sans-serif">
      + Ajouter un item
    </button>
  </header>

  <!-- Page content -->
  <div class="p-8 flex-1">

    <!-- Stats strip -->
    <div id="statsBar" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6"></div>

    <!-- Category filters -->
    <div class="flex flex-wrap gap-2 mb-5" id="categoryFilters">
      <!-- rendered by JS -->
    </div>

    <!-- Items table card -->
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
      <div id="tableContainer">
        <!-- rendered by JS -->
      </div>
    </div>

  </div>
</main>


<!-- ══════════════════════════════════════════
  FORM MODAL  (Add / Edit)
══════════════════════════════════════════ -->
<div id="formModal"
  class="modal-backdrop hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-lg rounded-lg shadow-2xl overflow-hidden">

    <!-- Modal header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-gray-50">
      <h2 id="modalTitle" class="font-bold text-gray-800 text-sm uppercase tracking-wider" style="font-family:Montserrat,sans-serif">
        Ajouter un item
      </h2>
      <button id="closeFormModal" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
    </div>

    <!-- Form -->
    <form id="itemForm" class="px-6 py-5 flex flex-col gap-4">

      <!-- Nom -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style="font-family:Montserrat,sans-serif">
          Nom <span class="text-red-400">*</span>
        </label>
        <input type="text" id="f_nom" required placeholder="Ex: Tataki de Thon rouge"
          class="w-full border border-gray-200 rounded px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold/30 transition">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style="font-family:Montserrat,sans-serif">
          Description <span class="text-gray-300 font-normal normal-case">(optionnel)</span>
        </label>
        <input type="text" id="f_description" placeholder="Ex: Sauce chien"
          class="w-full border border-gray-200 rounded px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold/30 transition">
      </div>

      <!-- Prix + Index side by side -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style="font-family:Montserrat,sans-serif">
            Prix (€) <span class="text-red-400">*</span>
          </label>
          <input type="number" id="f_prix" required min="0" step="0.5" placeholder="13.5"
            class="w-full border border-gray-200 rounded px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold/30 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style="font-family:Montserrat,sans-serif">
            Ordre d'affichage <span class="text-red-400">*</span>
          </label>
          <input type="number" id="f_index" required min="1" step="1" placeholder="1"
            class="w-full border border-gray-200 rounded px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold/30 transition">
        </div>
      </div>

      <!-- Catégorie + Type side by side -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style="font-family:Montserrat,sans-serif">
            Catégorie <span class="text-red-400">*</span>
          </label>
          <select id="f_categorie" required
            class="w-full border border-gray-200 rounded px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold/30 transition bg-white">
            <option value="">Choisir…</option>
            <option value="MENU MATIN">Menu Matin</option>
            <option value="MENU MIDI">Menu Midi</option>
            <option value="MENU SOIR">Menu Soir</option>
            <option value="MENU ENFANTS">Menu Enfants</option>
            <option value="NOS VINS">Nos Vins</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style="font-family:Montserrat,sans-serif">
            Type <span class="text-red-400">*</span>
          </label>
          <select id="f_type" required
            class="w-full border border-gray-200 rounded px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold/30 transition bg-white">
            <option value="">Choisir…</option>
            <option value="food">Food 🍽️</option>
            <option value="wine">Wine 🍷</option>
          </select>
        </div>
      </div>

      <!-- Form error -->
      <div id="formError" class="hidden text-xs text-red-500 bg-red-50 border border-red-200 rounded px-3 py-2"></div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-2 border-t border-gray-100">
        <button type="button" id="cancelFormBtn"
          class="text-sm text-gray-500 hover:text-gray-700 px-4 py-2 transition"
          style="font-family:Montserrat,sans-serif">
          Annuler
        </button>
        <button type="submit" id="submitFormBtn"
          class="bg-gold hover:bg-yellow-500 text-deep font-bold text-xs tracking-widest uppercase px-6 py-2.5 transition-colors"
          style="font-family:Montserrat,sans-serif">
          Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>


<!-- ══════════════════════════════════════════
  DELETE CONFIRM MODAL
══════════════════════════════════════════ -->
<div id="deleteModal"
  class="modal-backdrop hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-lg shadow-2xl p-6">
    <div class="text-center mb-5">
      <div class="text-4xl mb-3">🗑️</div>
      <h3 class="font-bold text-gray-800 text-sm uppercase tracking-wider mb-2" style="font-family:Montserrat,sans-serif">
        Supprimer cet item ?
      </h3>
      <p id="deleteItemName" class="text-gray-500 text-sm"></p>
      <p class="text-xs text-red-400 mt-2">Cette action est irréversible.</p>
    </div>
    <div class="flex gap-3">
      <button id="cancelDeleteBtn"
        class="flex-1 border border-gray-200 text-gray-600 text-sm py-2.5 hover:bg-gray-50 transition rounded"
        style="font-family:Montserrat,sans-serif">
        Annuler
      </button>
      <button id="confirmDeleteBtn"
        class="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm font-bold py-2.5 transition rounded"
        style="font-family:Montserrat,sans-serif">
        Supprimer
      </button>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════
  SCRIPTS — ES Module
══════════════════════════════════════════ -->
<script type="module">

// ─────────────────────────────────────────────────────────────
// SECTION 1 — SUPABASE CLIENT
// Import from CDN. config.js is gitignored and must exist locally.
// ─────────────────────────────────────────────────────────────

import { createClient }         from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON } from '../js/config.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

const TABLE = 'Menu_items';  // must match the exact Supabase table name

// ─────────────────────────────────────────────────────────────
// SECTION 2 — APP STATE
// Central object — avoids scattered global variables.
// ─────────────────────────────────────────────────────────────

const state = {
  items:          [],           // all items fetched from DB
  activeCategory: 'ALL',        // currently selected filter
  editingId:      null,         // id_item being edited (null = adding new)
  pendingDeleteId: null,        // id_item waiting for delete confirm
};

// Category metadata: display label + Tailwind badge colors
const CATEGORIES = {
  'ALL':          { label: 'Tous',          badge: 'bg-gray-100 text-gray-600'    },
  'MENU MATIN':   { label: 'Menu Matin',    badge: 'bg-sky-100 text-sky-700'      },
  'MENU MIDI':    { label: 'Menu Midi',     badge: 'bg-amber-100 text-amber-700'  },
  'MENU SOIR':    { label: 'Menu Soir',     badge: 'bg-violet-100 text-violet-700'},
  'MENU ENFANTS': { label: 'Menu Enfants',  badge: 'bg-green-100 text-green-700'  },
  'NOS VINS':     { label: 'Nos Vins',      badge: 'bg-rose-100 text-rose-700'    },
};

const TYPE_BADGES = {
  food:  'bg-orange-100 text-orange-700',
  wine:  'bg-purple-100 text-purple-700',
};


// ─────────────────────────────────────────────────────────────
// SECTION 3 — DATABASE (CRUD)
// All Supabase calls live here. Each function returns { data, error }.
//
// NOTE ON RLS: The anon key needs INSERT/UPDATE/DELETE policies set
// in Supabase → Authentication → Policies for these to work.
// For production, replace anon policies with Supabase Auth checks:
//   auth.uid() IS NOT NULL   (only logged-in users can write)
// ─────────────────────────────────────────────────────────────

// READ — fetch all items, ordered by category then index
async function dbFetchAll() {
  const { data, error } = await supabase
    .from(TABLE)
    .select('*')
    .order('categorie_item', { ascending: true })
    .order('index_item',     { ascending: true });

  return { data: data ?? [], error };
}

// CREATE — insert one new row
async function dbCreate(payload) {
  const { data, error } = await supabase
    .from(TABLE)
    .insert([payload])
    .select()         // return the inserted row
    .single();

  return { data, error };
}

// UPDATE — update one row by id_item
async function dbUpdate(id, payload) {
  const { data, error } = await supabase
    .from(TABLE)
    .update(payload)
    .eq('id_item', id)
    .select()
    .single();

  return { data, error };
}

// DELETE — delete one row by id_item
async function dbDelete(id) {
  const { error } = await supabase
    .from(TABLE)
    .delete()
    .eq('id_item', id);

  return { error };
}


// ─────────────────────────────────────────────────────────────
// SECTION 4 — UI RENDERERS
// Pure functions: take state, return HTML or mutate specific DOM nodes.
// ─────────────────────────────────────────────────────────────

// Price: 13.5 → "13,50€"  |  7 → "7€"
function formatPrice(value) {
  const n = Number(value);
  return n === Math.floor(n) ? n + '€' : n.toFixed(2).replace('.', ',') + '€';
}

// Badge HTML helper
function badge(text, classes) {
  return `<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full ${classes}">${text}</span>`;
}

// Category badge
function catBadge(cat) {
  const meta = CATEGORIES[cat] ?? { label: cat, badge: 'bg-gray-100 text-gray-600' };
  return badge(meta.label, meta.badge);
}

// Type badge
function typeBadge(type) {
  const label = type === 'wine' ? '🍷 Vin' : '🍽️ Plat';
  return badge(label, TYPE_BADGES[type] ?? 'bg-gray-100 text-gray-600');
}

// ── Stats strip ──────────────────────────────────────────────
function renderStats() {
  const counts = {};
  state.items.forEach(item => {
    counts[item.categorie_item] = (counts[item.categorie_item] ?? 0) + 1;
  });

  const html = Object.entries(CATEGORIES)
    .filter(([key]) => key !== 'ALL')
    .map(([key, meta]) => {
      const count = counts[key] ?? 0;
      return `
        <div class="bg-white border border-gray-200 rounded-lg p-3 text-center">
          <p class="text-2xl font-bold text-gray-800">${count}</p>
          <p class="text-xs text-gray-400 mt-0.5 leading-tight" style="font-family:Montserrat,sans-serif">${meta.label}</p>
        </div>`;
    }).join('');

  document.getElementById('statsBar').innerHTML = html;
}

// ── Category filter pills ────────────────────────────────────
function renderFilters() {
  const html = Object.entries(CATEGORIES).map(([key, meta]) => {
    const isActive  = state.activeCategory === key;
    const baseClass = 'text-xs font-semibold px-4 py-1.5 rounded-full border transition-colors cursor-pointer';
    const activeClass = isActive
      ? 'bg-deep text-gold border-deep'
      : 'bg-white text-gray-500 border-gray-200 hover:border-gray-400';
    return `
      <button class="${baseClass} ${activeClass}" data-filter="${key}"
        style="font-family:Montserrat,sans-serif">
        ${meta.label}
      </button>`;
  }).join('');

  document.getElementById('categoryFilters').innerHTML = html;

  // Bind filter clicks
  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeCategory = btn.dataset.filter;
      renderFilters();
      renderTable();
    });
  });
}

// ── Items table ──────────────────────────────────────────────
function renderTable() {
  const container = document.getElementById('tableContainer');

  const filtered = state.activeCategory === 'ALL'
    ? state.items
    : state.items.filter(i => i.categorie_item === state.activeCategory);

  if (!filtered.length) {
    container.innerHTML = `
      <div class="py-20 text-center text-gray-400">
        <p class="text-4xl mb-3">🍽️</p>
        <p class="text-sm" style="font-family:Montserrat,sans-serif">
          ${state.items.length === 0 ? 'Aucun item dans la base de données.' : 'Aucun item dans cette catégorie.'}
        </p>
        ${state.items.length === 0
          ? `<p class="text-xs mt-2 text-gray-300">Cliquez sur "Ajouter un item" pour commencer.</p>`
          : ''}
      </div>`;
    return;
  }

  const rows = filtered.map(item => `
    <tr class="item-row border-t border-gray-100 transition-colors">
      <td class="px-4 py-3 text-gray-400 text-sm w-12 text-center">${item.index_item}</td>
      <td class="px-4 py-3">
        <p class="text-sm font-semibold text-gray-800">${item.nom_item}</p>
        ${item.description_item
          ? `<p class="text-xs text-gray-400 mt-0.5 italic">${item.description_item}</p>`
          : ''}
      </td>
      <td class="px-4 py-3">${catBadge(item.categorie_item)}</td>
      <td class="px-4 py-3">${typeBadge(item.type_item)}</td>
      <td class="px-4 py-3 text-sm font-semibold text-gray-700 w-24 text-right">
        ${formatPrice(item.prix_item)}
      </td>
      <td class="px-4 py-3 w-24">
        <div class="flex items-center gap-2 justify-end">
          <button class="btn-edit text-blue-400 hover:text-blue-600 text-sm transition-colors p-1"
            data-id="${item.id_item}" title="Modifier">✏️</button>
          <button class="btn-delete text-red-300 hover:text-red-500 text-sm transition-colors p-1"
            data-id="${item.id_item}" data-name="${item.nom_item}" title="Supprimer">🗑️</button>
        </div>
      </td>
    </tr>`).join('');

  container.innerHTML = `
    <table class="w-full text-left">
      <thead class="bg-gray-50 text-xs text-gray-400 uppercase tracking-wider border-b border-gray-200"
        style="font-family:Montserrat,sans-serif">
        <tr>
          <th class="px-4 py-3 w-12 text-center">#</th>
          <th class="px-4 py-3">Nom</th>
          <th class="px-4 py-3">Catégorie</th>
          <th class="px-4 py-3">Type</th>
          <th class="px-4 py-3 text-right">Prix</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
    <div class="px-4 py-3 border-t border-gray-100 text-xs text-gray-400" style="font-family:Montserrat,sans-serif">
      ${filtered.length} item${filtered.length > 1 ? 's' : ''}
      ${state.activeCategory !== 'ALL' ? ` dans "${CATEGORIES[state.activeCategory]?.label}"` : ' au total'}
    </div>`;

  // Wire edit + delete buttons using event delegation
  container.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => openFormModal(btn.dataset.id));
  });
  container.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => openDeleteModal(btn.dataset.id, btn.dataset.name));
  });
}

// ── Loading skeleton ─────────────────────────────────────────
function renderLoading() {
  const rows = Array(5).fill(0).map(() => `
    <tr class="border-t border-gray-100">
      <td class="px-4 py-3"><div class="skeleton h-4 w-8 mx-auto"></div></td>
      <td class="px-4 py-3"><div class="skeleton h-4 w-48"></div></td>
      <td class="px-4 py-3"><div class="skeleton h-4 w-24"></div></td>
      <td class="px-4 py-3"><div class="skeleton h-4 w-16"></div></td>
      <td class="px-4 py-3"><div class="skeleton h-4 w-12 ml-auto"></div></td>
      <td class="px-4 py-3"><div class="skeleton h-4 w-16 ml-auto"></div></td>
    </tr>`).join('');

  document.getElementById('tableContainer').innerHTML = `
    <table class="w-full">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          ${['#','Nom','Catégorie','Type','Prix','Actions'].map(h =>
            `<th class="px-4 py-3 text-xs text-gray-400 uppercase text-left">${h}</th>`
          ).join('')}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Toast notification ───────────────────────────────────────
function showToast(message, type = 'success') {
  const colors = {
    success: 'bg-green-500 text-white',
    error:   'bg-red-500 text-white',
    info:    'bg-blue-500 text-white',
  };
  const toast = document.createElement('div');
  toast.className = `toast pointer-events-auto px-4 py-3 rounded shadow-lg text-sm font-medium max-w-xs ${colors[type]}`;
  toast.style.fontFamily = 'Montserrat, sans-serif';
  toast.textContent = message;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}


// ─────────────────────────────────────────────────────────────
// SECTION 5 — MODAL HANDLERS
// ─────────────────────────────────────────────────────────────

// ── Form modal (Add / Edit) ──────────────────────────────────
function openFormModal(idToEdit = null) {
  const modal     = document.getElementById('formModal');
  const title     = document.getElementById('modalTitle');
  const submitBtn = document.getElementById('submitFormBtn');

  clearFormError();
  document.getElementById('itemForm').reset();

  if (idToEdit) {
    // EDIT mode — prefill form with existing values
    const item = state.items.find(i => String(i.id_item) === String(idToEdit));
    if (!item) return;

    state.editingId = idToEdit;
    title.textContent = 'Modifier l\'item';
    submitBtn.textContent = 'Mettre à jour';

    document.getElementById('f_nom').value         = item.nom_item         ?? '';
    document.getElementById('f_description').value = item.description_item ?? '';
    document.getElementById('f_prix').value        = item.prix_item        ?? '';
    document.getElementById('f_index').value       = item.index_item       ?? '';
    document.getElementById('f_categorie').value   = item.categorie_item   ?? '';
    document.getElementById('f_type').value        = item.type_item        ?? '';
  } else {
    // ADD mode
    state.editingId = null;
    title.textContent = 'Ajouter un item';
    submitBtn.textContent = 'Enregistrer';
  }

  modal.classList.remove('hidden');
  document.getElementById('f_nom').focus();
}

function closeFormModal() {
  document.getElementById('formModal').classList.add('hidden');
  state.editingId = null;
  clearFormError();
}

function showFormError(msg) {
  const el = document.getElementById('formError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function clearFormError() {
  const el = document.getElementById('formError');
  el.textContent = '';
  el.classList.add('hidden');
}

// ── Delete confirm modal ─────────────────────────────────────
function openDeleteModal(id, name) {
  state.pendingDeleteId = id;
  document.getElementById('deleteItemName').textContent = `"${name}"`;
  document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal() {
  state.pendingDeleteId = null;
  document.getElementById('deleteModal').classList.add('hidden');
}


// ─────────────────────────────────────────────────────────────
// SECTION 6 — EVENT HANDLERS
// All user interactions wired here (single place to audit).
// ─────────────────────────────────────────────────────────────

// ── Add button ───────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', () => openFormModal());

// ── Close / cancel buttons ───────────────────────────────────
document.getElementById('closeFormModal').addEventListener('click', closeFormModal);
document.getElementById('cancelFormBtn').addEventListener('click', closeFormModal);
document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);

// Close modal when clicking the dark backdrop
document.getElementById('formModal').addEventListener('click', e => {
  if (e.target === document.getElementById('formModal')) closeFormModal();
});
document.getElementById('deleteModal').addEventListener('click', e => {
  if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
});

// Escape key closes any open modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeFormModal(); closeDeleteModal(); }
});

// ── Form submit (Add or Edit) ────────────────────────────────
document.getElementById('itemForm').addEventListener('submit', async e => {
  e.preventDefault();
  clearFormError();

  // Read + validate form values
  const nom         = document.getElementById('f_nom').value.trim();
  const description = document.getElementById('f_description').value.trim();
  const prix        = parseFloat(document.getElementById('f_prix').value);
  const index       = parseInt(document.getElementById('f_index').value, 10);
  const categorie   = document.getElementById('f_categorie').value;
  const type        = document.getElementById('f_type').value;

  if (!nom)                    return showFormError('Le nom est obligatoire.');
  if (isNaN(prix) || prix < 0) return showFormError('Le prix doit être un nombre positif.');
  if (isNaN(index) || index < 1) return showFormError("L'ordre d'affichage doit être ≥ 1.");
  if (!categorie)              return showFormError('Choisissez une catégorie.');
  if (!type)                   return showFormError('Choisissez un type (food ou wine).');

  const payload = {
    nom_item:         nom,
    description_item: description || null,
    prix_item:        prix,
    index_item:       index,
    categorie_item:   categorie,
    type_item:        type,
  };

  const submitBtn = document.getElementById('submitFormBtn');
  submitBtn.textContent = 'Enregistrement…';
  submitBtn.disabled = true;

  if (state.editingId) {
    // ── UPDATE ──────────────────────────────────────────────
    const { error } = await dbUpdate(state.editingId, payload);
    if (error) {
      showFormError(`Erreur: ${error.message}`);
      submitBtn.textContent = 'Mettre à jour';
      submitBtn.disabled = false;
      return;
    }
    showToast('Item mis à jour ✓', 'success');
  } else {
    // ── CREATE ──────────────────────────────────────────────
    const { error } = await dbCreate(payload);
    if (error) {
      showFormError(`Erreur: ${error.message}`);
      submitBtn.textContent = 'Enregistrer';
      submitBtn.disabled = false;
      return;
    }
    showToast('Item ajouté ✓', 'success');
  }

  submitBtn.disabled = false;
  closeFormModal();
  await loadAndRender();  // refresh table from DB
});

// ── Delete confirm ───────────────────────────────────────────
document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  const id = state.pendingDeleteId;
  if (!id) return;

  document.getElementById('confirmDeleteBtn').textContent = 'Suppression…';

  const { error } = await dbDelete(id);

  if (error) {
    showToast(`Erreur: ${error.message}`, 'error');
  } else {
    showToast('Item supprimé.', 'info');
  }

  closeDeleteModal();
  await loadAndRender();
});

// TODO: replace with supabase.auth.signOut() → redirect to /admin/login.html
document.getElementById('logoutBtn').addEventListener('click', () => {
  showToast('Auth non configurée — voir js/admin-auth.js (à venir)', 'info');
});


// ─────────────────────────────────────────────────────────────
// SECTION 7 — INIT
// Entry point: fetch data, render everything.
//
// AUTH HOOK (future):
//   const session = await supabase.auth.getSession();
//   if (!session.data.session) { window.location = '/admin/login.html'; return; }
// ─────────────────────────────────────────────────────────────

async function loadAndRender() {
  renderLoading();

  const { data, error } = await dbFetchAll();

  if (error) {
    document.getElementById('tableContainer').innerHTML = `
      <div class="py-20 text-center">
        <p class="text-4xl mb-3">⚠️</p>
        <p class="text-sm text-red-500 font-medium" style="font-family:Montserrat,sans-serif">
          Impossible de charger les données.
        </p>
        <p class="text-xs text-gray-400 mt-2">${error.message}</p>
        <p class="text-xs text-gray-400 mt-1">
          Vérifiez les politiques RLS dans Supabase (INSERT / UPDATE / DELETE pour anon).
        </p>
      </div>`;
    return;
  }

  state.items = data;
  renderStats();
  renderFilters();
  renderTable();
}

// Boot
loadAndRender();

</script>
